<!DOCTYPE html>
<html lang="ru" data-validate="html">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студия шрифтов Paratype</title>

  <body class="body">
    {{> header}}
    <main class="main">
      <h1 class="visually-hidden">Студия шрифтов Paratype</h1>
      {{> promo}}

      {{> new-fonts}}
